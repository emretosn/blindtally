[package]
name = "blindtally-server"
version = "0.1.0"
edition = "2024"

[dependencies]
blindtally-core = { path = "../core" }
tfhe = { version = "1.8", features = ["integer"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
